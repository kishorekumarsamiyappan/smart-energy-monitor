%% EMQX Topic-Level ACL Rules
%% Each ESP32-S3 device authenticates with username dev_<deviceid> or clientid <DEVICEID>
%% and can ONLY publish its own telemetry/status/alerts and subscribe to its own config/command.

{allow, {username, "backend-ingestor"}, all, ["energy/#"]}.

{allow, {clientid, {re, "^[A-Z0-9_-]{4,32}$"}}, publish, [
  "energy/${clientid}/telemetry",
  "energy/${clientid}/status",
  "energy/${clientid}/alerts"
]}.

{allow, {clientid, {re, "^[A-Z0-9_-]{4,32}$"}}, subscribe, [
  "energy/${clientid}/config",
  "energy/${clientid}/command"
]}.

{deny, all}.
