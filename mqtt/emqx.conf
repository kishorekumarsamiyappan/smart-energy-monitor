## EMQX 5.x Broker Configuration for Smart Energy Monitor
## Production uses MQTT over TLS (listener 8883) with device-specific credentials & ACLs.

node {
  name = "sem_emqx@127.0.0.1"
  cookie = "change-me-emqx-cluster-cookie"
  data_dir = "/opt/emqx/data"
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 10240
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    certfile = "/opt/emqx/etc/certs/server.crt"
    keyfile = "/opt/emqx/etc/certs/server.key"
    verify = verify_peer
    fail_if_no_peer_cert = false
    versions = ["tlsv1.3", "tlsv1.2"]
  }
}

## Disable unencrypted public listener in production; allow only inside isolated local Docker dev
listeners.tcp.local_dev {
  bind = "127.0.0.1:1883"
  max_connections = 1024
}

authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}
